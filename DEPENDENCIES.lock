## Instructions for Verification

To verify this build matches the audited commit:

1. Check out commit 356b0fe:
   ```bash
   git checkout 356b0fe
   ```

2. Install dependencies (should match versions above):
   ```bash
   npm install
   ```

3. Verify ethers version:
   ```bash
   npm list ethers
   ```

4. Build:
   ```bash
   npm run build
   ```

5. Run tests:
   ```bash
   npm test
   ```

## Security Note

